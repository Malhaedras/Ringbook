<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ring workbench</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--bg:#0f0f14;--fg:#e8e8f0;--muted:#8a8aa0;--card:#16161e;--input:#0e0e16;--border:#2a2a38;
    --hover:#4a4a60;--primary:#8a7ae0;--success:#4fa870;--error:#d05050;--secondary:#22222e;
    --secondary-fg:#e8e8f0;--mutedbg:#1d1d28}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:13px;
    padding-bottom:env(safe-area-inset-bottom)}
  header{padding:14px 18px 10px;border-bottom:1px solid var(--border)}
  h1{font-size:15px;font-weight:500;margin:0 0 3px}
  .sub{font-size:11.5px;color:var(--muted);margin:0}
  main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:14px 18px 40px;align-items:start}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  main>section:last-child{min-width:0}
  input[type=text],textarea{font:inherit;background:var(--input);color:var(--fg);border:1px solid var(--border);
    border-radius:6px;padding:5px 8px;width:100%}
  input[type=text]:focus,textarea:focus{border-color:var(--hover);outline:none}
  svg{display:block;width:100%;max-width:700px;aspect-ratio:700/520;height:auto}
  .nl{font-size:11px;fill:var(--fg)}.num{font-size:10px;fill:var(--muted);font-weight:500}
  .node{cursor:pointer}
  .list{border:1px solid var(--border);border-radius:8px;max-height:260px;overflow:auto;background:var(--card);margin-top:7px}
  .item{display:flex;gap:7px;align-items:center;padding:6px 9px;cursor:pointer;border-bottom:1px solid var(--mutedbg)}
  .item:last-child{border-bottom:none}.item:hover{background:var(--mutedbg)}
  .item.sel{background:var(--mutedbg);box-shadow:inset 2px 0 0 var(--primary)}
  .item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;padding:1px 5px;border-radius:4px;flex:none}
  .b-ok{color:var(--success);background:#4fa87022}.b-bad{color:var(--error);background:#d0505022}
  .b-short{color:#d9a441;background:#d9a44122}
  .panel{border:1px solid var(--border);border-radius:8px;padding:9px;background:var(--card);margin-top:9px;font-size:12px}
  .muted{color:var(--muted)}.ok{color:var(--success)}.bad{color:var(--error)}.warn{color:#d9a441}
  .btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);
    background:var(--secondary);color:var(--secondary-fg);cursor:pointer}
  button:hover{border-color:var(--hover)}
  button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
  .lrow{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .lrow:hover{background:var(--mutedbg)}
  .lrow.active{border-color:var(--hover);background:var(--mutedbg)}
  .chip{width:9px;height:20px;border-radius:3px;flex:none}
  .lrow input{flex:1;min-width:0}
  .stat{font-size:10.5px;flex:none}
  .del{flex:none;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:1px 3px}
  .del:hover{color:var(--error)}
  .setverdict{font-size:12.5px;font-weight:500;padding:1px 0 6px}
  .note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:7px}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
  #gate.off{display:none}
  #gate .box{width:280px;text-align:center}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h1>Locked</h1>
  <p class="sub" style="margin-bottom:10px">Enter the phrase</p>
  <input type="password" id="pw" placeholder="passphrase">
  <div class="btns" style="justify-content:center"><button class="pri" id="unlock">Unlock</button></div>
  <p class="note" id="pwerr"></p>
</div></div>
<header>
  <h1>Ring workbench</h1>
  <p class="sub">Click nodes to build the active layer. Name it and save, or paste notation.</p>
</header>
<main>
  <section>
    <label>Work name</label>
    <input type="text" id="wname" placeholder="unnamed work" maxlength="40">
    <div class="btns">
      <button class="pri" id="save">Save to book</button>
      <button id="lock">Lock</button>
      <button id="newspell">New</button>
      <button id="copynota">Copy notation</button>
    </div>

    <div class="panel">
      <div class="muted" style="margin-bottom:5px">Notation in</div>
      <textarea id="nota" rows="3" placeholder="Lease :: engine=3-8-14 / vital fire=2-3-8"></textarea>
      <div class="btns"><button id="loadnota">Load into builder</button></div>
    </div>

    <div class="panel">
      <div class="muted" style="margin-bottom:5px">Access token</div>
      <input type="text" id="tok" placeholder="ghp_…">
      <div class="btns"><button id="settok">Save token</button></div>
    </div>

    <label style="margin-top:12px">Library</label>
    <input type="text" id="q" placeholder="search name or node number">
    <div class="list" id="list"></div>
    <div class="btns">
      <button id="delbook">Delete entry</button>
      <button id="dupes">Find duplicates</button>
      <button id="exp">Export book</button>
      <button id="imp">Import</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
    <div id="sync" class="note"></div>
    <p class="note">Opposed cardinals 1/9 and 5/13 cannot share a layer.</p>
  </section>

  <section>
    <svg id="ring" viewBox="0 0 700 520" width="700" height="520"></svg>
    <div class="panel">
      <div class="setverdict" id="verdict"></div>
      <div id="layers"></div>
      <div class="btns">
        <button id="add">Add layer</button><button id="undo">Undo</button>
        <button id="clearlayer">Clear layer</button><button id="clearall">Clear work</button>
      </div>
      <div id="detail" class="panel" style="border:none;border-top:1px solid var(--border);border-radius:0;margin-top:9px"></div>
    </div>
  </section>
</main>

<script src="./config.js"></script>
<script>
const NODES=[{n:1,name:"Fire",t:"cardinal"},{n:2,name:"Life",t:"abstract"},{n:3,name:"Ember",t:"compound"},
{n:4,name:"Light",t:"abstract"},{n:5,name:"Air",t:"cardinal"},{n:6,name:"Attraction",t:"abstract"},
{n:7,name:"Nifl",t:"compound"},{n:8,name:"Time",t:"abstract"},{n:9,name:"Water",t:"cardinal"},
{n:10,name:"Death",t:"abstract"},{n:11,name:"Erosion",t:"compound"},{n:12,name:"Darkness",t:"abstract"},
{n:13,name:"Earth",t:"cardinal"},{n:14,name:"Levity",t:"abstract"},{n:15,name:"Magma",t:"compound"},
{n:16,name:"Space",t:"abstract"}];
const PAIRS=[[2,10,"Life/Death"],[4,12,"Light/Darkness"],[6,14,"Attraction/Levity"],[8,16,"Time/Space"]];
const CARD=[[1,9,"Fire/Water"],[5,13,"Air/Earth"]];
const COL=["#e0574f","#5a9ae0","#e8b060","#6ad08a","#a89af0","#e07aa8","#4fc0c0","#c8c860"];
const CX=350,CY=250,R=182,ang=n=>(n-1)*22.5;
const pos=n=>{const a=ang(n)*Math.PI/180;return[CX+R*Math.sin(a),CY-R*Math.cos(a)];};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NAME=n=>(NODES[n-1]||{name:"?"}).name;
const lvl=c=>c<=3?"basic":c===4?"elevated":c===5?"high":"very high";
const colorOf=i=>COL[i%8];

const SEED=`Fireball :: 1-3-5
Great Gale :: 2-5-14
Hold Person :: 6-12-16
Baelfyre :: 1-2-3-5
Containment :: 6-16-8-10
Greater containment :: 10-6-4-16-12-8
Black fire :: 1-3-4-5-12
Fire-smother :: 7-9-10-13
Killing curse :: 4-10-12
Lumos :: 4-8-16
Nox :: 8-12-16
Weirlight :: 4-6-14
Hanging fireball :: 1-6-14
Pinned ground fire :: 1-6-13-16
Fumarole :: 1-7-14
Smouldering fever :: 3-8-10
Rising black fog :: 5-7-12-14
Homing magma :: 4-6-8-12-15
Hearth and beacon :: 1-4-8-13
Living black lava :: 2-8-12-15
Arousal mist :: 2-5-6-7-9
Brownout :: 5-6-7-9-10
Pull bolt :: 6-8-16
Portal :: 4-12-16
Healing touch :: 2-4-8-16
Death touch :: 8-10-16
Invisibility :: 4-8-12-16
Firestorm :: 1-4-5-12
Unsmotherable ember :: 3-4-12
Create Star :: 1-6-12
Create Moon :: 4-9-14
Vacuum :: 5-10-16
Create Living Earth :: 13-2-8
Crucible :: 3-7-11-15
Fourfold Paradigm :: star=1-6-12 / moon=4-9-14 / aether=5-10-16 / living earth=13-2-8
Lease :: engine=3-8-14 / vital fire=2-3-8 / deadlock=2-10-14 / anchor=6-8-16 / upkeep=2-3-9-11`;

let work={name:"",layers:[{name:"layer 1",nodes:[]}],active:0,editing:null};
let book=[],sel=null;
const GH=window.GH_CONFIG||{};
let sha=null,pushing=false,dirty=false;

const cache=()=>{try{localStorage.setItem("ringbook_cache",JSON.stringify(book));}catch(e){}};
const save=()=>{cache();dirty=true;push();};

function status(t,extra){
  const el=document.getElementById("sync");if(!el)return;
  const base={saving:"saving…",synced:"synced",offline:"offline — will retry",local:"saved locally"}[t]||"";
  el.textContent=base+(extra?" ("+extra+")":"");
  el.className="note "+(t==="offline"?"bad":t==="synced"?"ok":"muted");
}
const tok=()=>localStorage.getItem("ringbook_token")||GH.token||"";

async function pull(){
  const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,
    {headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"}});
  if(r.status===404){sha=null;return [];}
  if(!r.ok)throw new Error("get "+r.status);
  const j=await r.json();sha=j.sha;
  return JSON.parse(atob(j.content.replace(/\n/g,"")));
}

async function push(){
  if(!tok()){status("local");return;}
  if(pushing||!dirty)return;
  pushing=true;dirty=false;status("saving");
  const body={message:"update book",content:btoa(unescape(encodeURIComponent(JSON.stringify(book))))};
  if(sha)body.sha=sha;
  try{
    const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,
      {method:"PUT",headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json","Content-Type":"application/json"},
       body:JSON.stringify(body)});
    if(r.status===409){await pull();dirty=true;throw new Error("conflict, retrying");}
    if(!r.ok)throw new Error("put "+r.status);
    sha=(await r.json()).content.sha;
    status("synced");
  }catch(e){dirty=true;status("offline",e.message);}
  finally{pushing=false;if(dirty)setTimeout(push,1500);}
}

function parse(txt){
  const out=[];
  txt.split(/\n/).forEach(line=>{
    const m=line.split("::");if(m.length<2)return;
    const name=m[0].trim();if(!name)return;
    const layers=m.slice(1).join("::").split("/").map(seg=>{
      let label=null,body=seg;
      if(seg.includes("=")){const p=seg.split("=");label=p[0].trim()||null;body=p.slice(1).join("=");}
      const nodes=body.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=16);
      return nodes.length?{label,nodes}:null;
    }).filter(Boolean);
    if(layers.length)out.push({name,layers});
  });
  return out;
}
const notaOf=w=>w.name+" :: "+w.layers.map(l=>l.name+"="+l.nodes.join("-")).join(" / ");

const sig=w=>w.layers.map(l=>[...l.nodes].sort((a,b)=>a-b).join(",")).filter(Boolean).sort().join("|");
function findDupes(entry,skipIdx){
  const s=sig(entry),name=entry.name.trim().toLowerCase();
  const exact=[],sameName=[],near=[];
  const setE=new Set(entry.layers.flatMap(l=>l.nodes));
  book.forEach((b,i)=>{
    if(i===skipIdx)return;
    if(sig({layers:b.layers})===s){exact.push(i);return;}
    const setB=new Set(b.layers.flatMap(l=>l.nodes));
    let inter=0;setE.forEach(n=>{if(setB.has(n))inter++;});
    const union=new Set([...setE,...setB]).size;
    if(b.name.trim().toLowerCase()===name)sameName.push(i);
    if(union&&inter/union>=0.6)near.push({i,j:inter/union});
  });
  return{exact,sameName,near};
}

function layerStatus(l){
  if(l.nodes.length<3)return{cls:"warn",label:"short",v:"Incomplete — needs three vertices."};
  const bad=CARD.filter(([a,b])=>l.nodes.includes(a)&&l.nodes.includes(b));
  if(bad.length)return{cls:"bad",label:"fizzle",v:"FIZZLE — "+bad.map(x=>x[2]).join(", ")+"."};
  return{cls:"ok",label:"tunes",v:"Tunes."};
}

function build(){
  const svg=document.getElementById("ring");
  let s=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#414157" stroke-width="1.2"/>
    <circle cx="${CX}" cy="${CY}" r="3" fill="#414157"/>`;
  work.layers.forEach((l,i)=>{
    const so=[...l.nodes].sort((a,b)=>ang(a)-ang(b));
    if(so.length>=2)s+=`<polygon points="${so.map(n=>pos(n).join(",")).join(" ")}" fill="${colorOf(i)}"
      fill-opacity="0.11" stroke="${colorOf(i)}" stroke-width="${i===work.active?2.8:1.5}" stroke-linejoin="round"/>`;
  });
  NODES.forEach(nd=>{
    const [x,y]=pos(nd.n),a=ang(nd.n)*Math.PI/180;
    const lx=CX+206*Math.sin(a),ly=CY-206*Math.cos(a);
    const anch=Math.sin(a)>0.3?"start":Math.sin(a)<-0.3?"end":"middle";
    const own=work.layers.map((l,i)=>l.nodes.includes(nd.n)?i:-1).filter(i=>i>=0);
    const st=own.length?colorOf(own[own.length-1]):"#4a4a60";
    const w=own.includes(work.active)?3:own.length?1.8:1.4;
    s+=`<g class="node" data-n="${nd.n}"><circle cx="${x}" cy="${y}" r="${nd.t==="cardinal"?10:7}"
      fill="${own.length?"var(--mutedbg)":"#1a1a24"}" stroke="${st}" stroke-width="${w}"/>
      <text class="num" x="${x}" y="${y+3.5}" text-anchor="middle">${nd.n}</text>
      <text class="nl" x="${lx}" y="${ly+3.5}" text-anchor="${anch}">${nd.name}</text></g>`;
  });
  svg.innerHTML=s;
  svg.querySelectorAll(".node").forEach(g=>g.onclick=()=>toggle(+g.dataset.n));
  panel();list();
}

function panel(){
  const fz=work.layers.filter(l=>layerStatus(l).cls==="bad").length;
  const allShort=work.layers.every(l=>l.nodes.length<3);
  const v=document.getElementById("verdict");
  if(fz){v.className="setverdict bad";v.textContent="SET FAILS — "+fz+" layer"+(fz>1?"s":"")+" fizzling.";}
  else if(allShort){v.className="setverdict warn";v.textContent="Nothing complete yet.";}
  else{v.className="setverdict ok";v.textContent="All layers tune.";}

  const host=document.getElementById("layers");host.innerHTML="";
  work.layers.forEach((l,i)=>{
    const st=layerStatus(l);
    const row=document.createElement("div");
    row.className="lrow"+(i===work.active?" active":"");
    row.innerHTML=`<span class="chip" style="background:${colorOf(i)}"></span>
      <input value="${esc(l.name)}" maxlength="32">
      <span class="stat ${st.cls}">${l.nodes.length} · ${st.label}</span>
      <button class="del" title="delete layer">×</button>`;
    row.onclick=e=>{if(e.target===inp)return;work.active=i;build();};
    const inp=row.querySelector("input");
    inp.onmousedown=e=>e.stopPropagation();
    inp.oninput=()=>{l.name=inp.value;};
    inp.onfocus=()=>{work.active=i;};
    row.querySelector(".del").onclick=e=>{e.stopPropagation();
      if(work.layers.length===1)work.layers[0].nodes=[];
      else{work.layers.splice(i,1);work.active=Math.min(work.active,work.layers.length-1);}
      build();};
    host.appendChild(row);
  });

  const act=work.layers[work.active],st=layerStatus(act),d=document.getElementById("detail");
  let h=`<div class="${st.cls}"><b>${esc(act.name)}</b> — ${st.v}</div>`;
  if(act.nodes.length){
    const so=[...act.nodes].sort((a,b)=>ang(a)-ang(b));
    h+=`<div class="muted">${so.map(n=>n+" "+NAME(n)).join(" · ")}</div>`;
    const c=so.filter(n=>NODES[n-1].t==="cardinal").length,
          p=so.filter(n=>NODES[n-1].t==="compound").length,
          a2=so.filter(n=>NODES[n-1].t==="abstract").length;
    h+=`<div class="muted">${so.length} vertices — ${lvl(so.length)} · ${c} cardinal / ${p} compound / ${a2} abstract</div>`;
    if(so.length>=2){
      let gs=[];for(let k=0;k<so.length;k++){const x=ang(so[k]),y=ang(so[(k+1)%so.length]);
        gs.push({p:[so[k],so[(k+1)%so.length]],v:((y-x)+360)%360/22.5});}
      const mx=Math.max(...gs.map(g=>g.v)),mn=gs.reduce((m,g)=>g.v<m.v?g:m,gs[0]);
      h+=`<div class="muted">Hub: ${mx<8?"enclosed (aimed / area)":mx===8?"on the edge (line spell)":"open (projected)"}</div>`;
      h+=`<div class="muted">Apex: ${mn.p[0]} ${NAME(mn.p[0])} / ${mn.p[1]} ${NAME(mn.p[1])}</div>`;
    }
    const pr=PAIRS.filter(([a,b])=>act.nodes.includes(a)&&act.nodes.includes(b));
    h+=pr.length?`<div class="muted">Pair present (dampening): ${pr.map(x=>x[2]).join(", ")}</div>`
                :`<div class="muted">No opposition pair — undampened.</div>`;
    if(pr.length===1&&act.nodes.length===3){
      const [a,b]=pr[0],bare=act.nodes.find(n=>n!==a&&n!==b);
      if(bare)h+=`<div class="muted">Eraser: pair consumes itself, leaves <b>${bare} ${NAME(bare)}</b> bare.</div>`;
    }
  }
  const used=new Set(work.layers.flatMap(l=>l.nodes));
  const tv=work.layers.reduce((t,l)=>t+l.nodes.length,0);
  h+=`<div class="muted" style="margin-top:4px">Work: ${work.layers.length} layer(s) · ${tv} vertices · ${used.size} distinct</div>`;
  d.innerHTML=h;
}

function list(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const host=document.getElementById("list");host.innerHTML="";
  book.map((s,i)=>({s,i})).filter(({s})=>!q||s.name.toLowerCase().includes(q)||
    s.layers.some(l=>l.nodes.join("-").includes(q))).forEach(({s,i})=>{
    const st=s.layers.some(l=>l.nodes.length<3)?"short":s.layers.some(l=>CARD.some(([a,b])=>l.nodes.includes(a)&&l.nodes.includes(b)))?"bad":"ok";
    const d=document.createElement("div");
    d.className="item"+(sel===i?" sel":"");
    d.innerHTML=`<span class="nm">${esc(s.name)}</span><span class="badge b-${st}">${st==="ok"?"tunes":st==="bad"?"fizzle":"short"}</span>`;
    d.onclick=()=>loadEntry(i);
    host.appendChild(d);
  });
}

function loadEntry(i){
  const s=book[i];
  work={name:s.name,layers:s.layers.map((l,k)=>({name:(l.label||"layer "+(k+1)),nodes:[...l.nodes]})),active:0,editing:i};
  sel=i;
  document.getElementById("wname").value=s.name;
  build();
}

function toggle(n){
  const l=work.layers[work.active];
  l.nodes.includes(n)?l.nodes=l.nodes.filter(x=>x!==n):l.nodes.push(n);
  build();
}

document.getElementById("q").oninput=list;
document.getElementById("add").onclick=()=>{
  if(work.layers.length>=8)return;
  work.layers.push({name:"layer "+(work.layers.length+1),nodes:[]});
  work.active=work.layers.length-1;build();
};
document.getElementById("undo").onclick=()=>{work.layers[work.active].nodes.pop();build();};
document.getElementById("clearlayer").onclick=()=>{work.layers[work.active].nodes=[];build();};
document.getElementById("clearall").onclick=()=>{
  work={name:"",layers:[{name:"layer 1",nodes:[]}],active:0,editing:null};
  sel=null;document.getElementById("wname").value="";build();
};
document.getElementById("newspell").onclick=()=>document.getElementById("clearall").click();
document.getElementById("lock").onclick=()=>{localStorage.removeItem("ringbook_unlocked");location.reload();};
document.getElementById("wname").oninput=e=>{work.name=e.target.value;};

document.getElementById("save").onclick=()=>{
  const nm=(work.name||"").trim();
  if(!nm){alert("Give the work a name first.");return;}
  const entry={name:nm,layers:work.layers.map(l=>({label:l.name,nodes:[...l.nodes]})).filter(l=>l.nodes.length)};
  if(!entry.layers.length){alert("It has no nodes yet.");return;}

  const d=findDupes(entry,work.editing);

  if(d.exact.length){
    const i=d.exact[0];
    if(confirm(`"${book[i].name}" already has this exact shape.\n\nOK = update that entry instead of saving a copy.\nCancel = save as a separate entry.`)){
      book[i]=entry;sel=i;work.editing=i;save();build();return;
    }
  }
  if(d.sameName.length){
    const i=d.sameName[0];
    if(confirm(`Another entry is already called "${book[i].name}".\n\nOK = overwrite it.\nCancel = save as a new entry.`)){
      book[i]=entry;sel=i;work.editing=i;save();build();return;
    }
  }
  if(d.near.length){
    const list=d.near.map(x=>`  ${book[x.i].name} — ${Math.round(x.j*100)}% shared`).join("\n");
    if(!confirm(`Similar entries exist:\n${list}\n\nSave anyway?`))return;
  }

  if(work.editing!==null&&book[work.editing]){book[work.editing]=entry;sel=work.editing;}
  else{book.push(entry);sel=book.length-1;work.editing=sel;}
  save();build();
};

document.getElementById("copynota").onclick=()=>{
  if(!work.name.trim()){alert("Name it first.");return;}
  navigator.clipboard.writeText(notaOf(work));
};
document.getElementById("loadnota").onclick=()=>{
  const add=parse(document.getElementById("nota").value);
  if(!add.length)return;
  const s=add[0];
  work={name:s.name,layers:s.layers.map((l,k)=>({name:(l.label||"layer "+(k+1)),nodes:[...l.nodes]})),active:0,editing:null};
  sel=null;document.getElementById("wname").value=s.name;
  document.getElementById("nota").value="";build();
};
document.getElementById("delbook").onclick=()=>{
  if(sel===null)return;
  if(!confirm(`Delete "${book[sel].name}"?`))return;
  book.splice(sel,1);sel=null;work.editing=null;save();build();
};
document.getElementById("dupes").onclick=()=>{
  const seen=new Map(),out=[];
  book.forEach((b,i)=>{
    const s=sig({layers:b.layers});
    if(seen.has(s))out.push([seen.get(s),i]);else seen.set(s,i);
  });
  if(!out.length){alert("No duplicate shapes in the book.");return;}
  alert("Duplicate shapes:\n"+out.map(([a,b])=>`  ${book[a].name}  =  ${book[b].name}`).join("\n"));
};
document.getElementById("exp").onclick=()=>{
  const b=new Blob([JSON.stringify(book,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="spellbook.json";
  a.click();URL.revokeObjectURL(a.href);
};
document.getElementById("imp").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){book=d;sel=null;save();build();}}catch(x){alert("Bad file.");}};
  r.readAsText(f);e.target.value="";
};

document.getElementById("settok").onclick=()=>{
  localStorage.setItem("ringbook_token",document.getElementById("tok").value.trim());
  location.reload();
};
document.getElementById("tok").value=localStorage.getItem("ringbook_token")||"";

const PW=(window.GH_CONFIG&&window.GH_CONFIG.password)||"";
if(!PW||localStorage.getItem("ringbook_unlocked")==="1")document.getElementById("gate").classList.add("off");
document.getElementById("unlock").onclick=()=>{
  if(document.getElementById("pw").value===PW){
    localStorage.setItem("ringbook_unlocked","1");
    document.getElementById("gate").classList.add("off");
  }else document.getElementById("pwerr").textContent="Wrong.";
};
document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")document.getElementById("unlock").click();};

async function initBook(){
  try{const c=JSON.parse(localStorage.getItem("ringbook_cache")||"null");if(Array.isArray(c)&&c.length)book=c;}catch(e){}
  if(!book.length)book=parse(SEED);
  try{const remote=await pull();if(Array.isArray(remote)&&remote.length)book=remote;status("synced");}
  catch(e){status("offline",e.message);}
  build();
}

addEventListener("online",()=>{if(dirty)push();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
initBook();
</script>
</body>
</html>
